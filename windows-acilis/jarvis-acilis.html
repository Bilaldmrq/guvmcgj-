<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>J.A.R.V.I.S.</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#020407;overflow:hidden;cursor:none;color-scheme:dark}
  body{transition:opacity 1s ease}
  body.out{opacity:0}
  @font-face{font-family:'Chakra Petch';src:local('Bahnschrift'),local('Segoe UI Semibold');}
  /* ===== AÇILIŞ: 3D ARK REAKTÖRÜ ===== */
  #intro{position:fixed;inset:0;z-index:100;background:#020407;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;
    user-select:none;font-family:'Chakra Petch',system-ui,sans-serif;color:#cfefff;}
  #ir3d{position:absolute!important;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  #intro .vig{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.88) 100%)}
  #intro .grain{position:absolute;inset:-50%;pointer-events:none;z-index:2;opacity:.06;animation:grain .5s steps(3) infinite;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  @keyframes grain{33%{transform:translate(-4%,3%)}66%{transform:translate(3%,-2%)}}
  .ibar{position:absolute;left:0;right:0;height:0;z-index:4;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:space-between;
    padding:0 5vw;font:400 .64rem/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.2em;color:rgba(150,225,255,.55);
    transition:height 1.2s cubic-bezier(.7,0,.2,1)}
  .ibar.t{top:0}.ibar.b{bottom:0}
  #intro.live .ibar{height:11vh}
  .ibar b{color:#bff6ff;font-weight:400}
  #iSkip{position:static;margin-left:22px;background:none;border:1px solid rgba(120,220,255,.35);color:rgba(170,235,255,.8);border-radius:0;box-shadow:none;
    font:400 .6rem 'JetBrains Mono',monospace;letter-spacing:.25em;padding:6px 10px;cursor:pointer;animation:none}
  #iSkip:hover{border-color:#7ff3ff;color:#fff}
  .iflash{position:absolute;inset:0;z-index:5;background:#fff;opacity:0;pointer-events:none}
  .tap{position:absolute;left:50%;bottom:13vh;transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:16px;
    font-weight:600;font-size:.7rem;letter-spacing:.7em;margin-right:-.7em;color:rgba(190,240,255,.8);transition:opacity .6s}
  .tap i{width:44px;height:44px;border:1px solid rgba(120,230,255,.55);border-radius:50%;position:relative;animation:ping 2.2s ease-out infinite}
  .tap i::after{content:"";position:absolute;inset:16px;border-radius:50%;background:#9ff6ff;box-shadow:0 0 12px #5ef2ff,0 0 28px #5ef2ff}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(94,242,255,.45)}100%{box-shadow:0 0 0 28px rgba(94,242,255,0)}}
  #intro.live .tap{opacity:0;pointer-events:none}
  .ilogo{position:absolute;left:0;right:0;top:53.5%;z-index:3;text-align:center;pointer-events:none}
  .ilogo .nm{display:inline-block;font-weight:700;line-height:1;font-size:clamp(2.6rem,14vw,6.4rem);letter-spacing:.9em;margin-right:-.9em;
    background:linear-gradient(100deg,#4b535c 0%,#aab4be 28%,#fff 45%,#8ff5ff 50%,#fff 55%,#aab4be 72%,#4b535c 100%);
    background-size:280% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;
    opacity:0;filter:blur(14px);transition:opacity 1.2s ease,filter 1.4s ease,letter-spacing 2.8s cubic-bezier(.16,1,.3,1),margin 2.8s cubic-bezier(.16,1,.3,1)}
  .ilogo .sub{margin-top:2.6vh;display:flex;justify-content:center;align-items:center;gap:16px;font-weight:600;font-size:clamp(.55rem,2.1vw,.78rem);
    letter-spacing:.65em;color:rgba(160,235,255,.85);opacity:0;transition:opacity 1.2s ease 1s}
  .ilogo .sub::before,.ilogo .sub::after{content:"";height:1px;width:min(14vw,110px);background:linear-gradient(90deg,transparent,#5ef2ff);
    transform:scaleX(0);transform-origin:right;transition:transform 1.4s cubic-bezier(.16,1,.3,1) 1.1s}
  .ilogo .sub::after{background:linear-gradient(270deg,transparent,#5ef2ff);transform-origin:left}
  #intro.logo .nm{opacity:1;filter:blur(0) drop-shadow(0 0 22px rgba(94,242,255,.35));letter-spacing:.3em;margin-right:-.3em;animation:sheen 2.8s cubic-bezier(.5,0,.25,1) .5s forwards}
  #intro.logo .sub{opacity:1}
  #intro.logo .sub::before,#intro.logo .sub::after{transform:scaleX(1)}
  @keyframes sheen{from{background-position:100% 0}to{background-position:0 0}}
  @media(max-width:600px){.ibar{font-size:.52rem;letter-spacing:.12em}#iSkip{margin-left:10px}}
  /* ===== ANA EKRAN ===== */
  .ihome{margin-top:4.2vh;display:flex;flex-direction:column;align-items:center;gap:1.6vh;opacity:0;transform:translateY(12px);
    transition:opacity 1s ease 1.6s,transform 1.2s cubic-bezier(.16,1,.3,1) 1.6s;pointer-events:none}
  .ihome .greet{font-weight:600;font-size:clamp(.95rem,3.6vw,1.25rem);letter-spacing:.08em;color:#e8fbff}
  .ihome .date{font:400 clamp(.6rem,2.2vw,.72rem)/1 'JetBrains Mono',monospace;letter-spacing:.25em;color:rgba(150,225,255,.6);text-transform:uppercase}
  #iReplay{margin-top:1.4vh;background:none;border:1px solid rgba(120,220,255,.35);color:rgba(190,240,255,.85);cursor:pointer;
    font:600 .62rem 'Chakra Petch',sans-serif;letter-spacing:.35em;padding:10px 18px;transition:border-color .3s,color .3s,box-shadow .3s}
  #iReplay:hover{border-color:#7ff3ff;color:#fff;box-shadow:0 0 18px rgba(94,242,255,.35)}
  #intro.home{cursor:default}
  #intro.home .ihome{opacity:1;transform:none;pointer-events:auto}
  #intro.nogl #ir3d{display:none}
  #intro.nogl .ilogo{top:50%;transform:translateY(-50%)}
  .tap,#iSkip,#iReplay{display:none!important}
  #intro{cursor:none}
</style>
</head>
<body>
<div id="intro">
  <canvas id="ir3d"></canvas>
  <div class="vig"></div><div class="grain"></div>
  <div class="ilogo">
    <div class="nm">BİLAL</div><div class="sub">MARK ∞ · ÇEVRİMİÇİ</div>
    <div class="ihome"><div class="greet" id="iGreet">&nbsp;</div><div class="date" id="iDate">&nbsp;</div></div>
  </div>
  <div class="ibar t"><span>J.A.R.V.I.S.</span><span id="iClock">--:--:--</span></div>
  <div class="ibar b"><span id="iMsg">&nbsp;</span><span>GÜÇ <b id="iPct">000</b>%</span></div>
  <div class="iflash" id="iFlash"></div>
</div>
