<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Sinem ❤️ Bilal – Aşkın Başlangıcı</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    height:100vh;overflow:hidden;font-family:'Poppins',sans-serif;color:#fff;
    background:linear-gradient(180deg,#2b0038 0%,#0a0012 80%);
  }
  .bg{position:fixed;inset:0;background:url('YOUR_CAT_IMAGE_URL') center/cover no-repeat;filter:brightness(.6) blur(2px);z-index:-2;transition:transform 3s ease;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);z-index:-1;}
  .content{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;animation:fadeIn 2s ease forwards;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-40px);}to{opacity:1;transform:translateY(0);}}
  h1{font-size:clamp(2rem,6vw,3.5rem);text-shadow:0 0 25px rgba(255,255,255,.5);}
  p{margin-top:10px;font-size:1rem;color:#ddd;max-width:90%;}
  .btns{margin-top:40px;display:flex;gap:20px;position:relative;width:90vw;height:70vh;border:none;justify-content:center;align-items:center;overflow:hidden;}
  button{padding:14px 28px;border:none;border-radius:40px;cursor:pointer;font-size:1.3rem;transition:.2s;box-shadow:0 5px 20px rgba(0,0,0,.3);position:absolute;}
  .yes{background:linear-gradient(45deg,#ff99b4,#ffe4f0);color:#111;font-weight:700;z-index:2;}
  .yes:hover{transform:scale(1.05);}
  .no{background:linear-gradient(45deg,#ff0000,#ff8c00);color:#fff;font-weight:bold;text-transform:uppercase;border:none;animation:glow 1s infinite alternate;z-index:2;}
  @keyframes glow{0%{box-shadow:0 0 10px #ff0000;}100%{box-shadow:0 0 40px #ff8c00;}}
  .loveMsg{display:none;flex-direction:column;align-items:center;justify-content:center;position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:10;animation:fadeIn 1s ease forwards;}
  .loveMsg h2{font-size:clamp(2.5rem,7vw,4.5rem);background:linear-gradient(90deg,#ffd1dc,#fff,#ffe07a);-webkit-background-clip:text;color:transparent;text-shadow:0 0 50px rgba(255,255,255,.6);}
  .loveMsg p{margin-top:10px;color:#ffe4ec;}
  canvas{position:fixed;inset:0;pointer-events:none;}
  @media(max-width:600px){h1{font-size:1.8rem;}button{font-size:1rem;padding:10px 20px;}}

  /* ===== AÇILIŞ: 3D ARK REAKTÖRÜ ===== */
  body.booting .content{animation:none;opacity:0}
  #intro{position:fixed;inset:0;z-index:100;background:#020407;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;
    user-select:none;font-family:'Chakra Petch',system-ui,sans-serif;color:#cfefff;transition:opacity 1.2s ease}
  #intro.exit{opacity:0;pointer-events:none}
  #ir3d{position:absolute!important;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  #intro .vig{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.88) 100%)}
  #intro .grain{position:absolute;inset:-50%;pointer-events:none;z-index:2;opacity:.06;animation:grain .5s steps(3) infinite;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  @keyframes grain{33%{transform:translate(-4%,3%)}66%{transform:translate(3%,-2%)}}
  .ibar{position:absolute;left:0;right:0;height:0;z-index:4;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:space-between;
    padding:0 5vw;font:400 .64rem/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.2em;color:rgba(150,225,255,.55);
    transition:height 1.2s cubic-bezier(.7,0,.2,1)}
  .ibar.t{top:0}.ibar.b{bottom:0}
  #intro.live .ibar{height:11vh}
  .ibar b{color:#bff6ff;font-weight:400}
  #iSkip{position:static;margin-left:22px;background:none;border:1px solid rgba(120,220,255,.35);color:rgba(170,235,255,.8);border-radius:0;box-shadow:none;
    font:400 .6rem 'JetBrains Mono',monospace;letter-spacing:.25em;padding:6px 10px;cursor:pointer;animation:none}
  #iSkip:hover{border-color:#7ff3ff;color:#fff}
  .iflash{position:absolute;inset:0;z-index:5;background:#fff;opacity:0;pointer-events:none}
  .tap{position:absolute;left:50%;bottom:13vh;transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:16px;
    font-weight:600;font-size:.7rem;letter-spacing:.7em;margin-right:-.7em;color:rgba(190,240,255,.8);transition:opacity .6s}
  .tap i{width:44px;height:44px;border:1px solid rgba(120,230,255,.55);border-radius:50%;position:relative;animation:ping 2.2s ease-out infinite}
  .tap i::after{content:"";position:absolute;inset:16px;border-radius:50%;background:#9ff6ff;box-shadow:0 0 12px #5ef2ff,0 0 28px #5ef2ff}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(94,242,255,.45)}100%{box-shadow:0 0 0 28px rgba(94,242,255,0)}}
  #intro.live .tap{opacity:0;pointer-events:none}
  .ilogo{position:absolute;left:0;right:0;top:64%;transform:translateY(-50%);z-index:3;text-align:center;pointer-events:none}
  .ilogo .nm{display:inline-block;font-weight:700;line-height:1;font-size:clamp(2.6rem,14vw,6.4rem);letter-spacing:.9em;margin-right:-.9em;
    background:linear-gradient(100deg,#4b535c 0%,#aab4be 28%,#fff 45%,#8ff5ff 50%,#fff 55%,#aab4be 72%,#4b535c 100%);
    background-size:280% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;
    opacity:0;filter:blur(14px);transition:opacity 1.2s ease,filter 1.4s ease,letter-spacing 2.8s cubic-bezier(.16,1,.3,1),margin 2.8s cubic-bezier(.16,1,.3,1)}
  .ilogo .sub{margin-top:2.6vh;display:flex;justify-content:center;align-items:center;gap:16px;font-weight:600;font-size:clamp(.55rem,2.1vw,.78rem);
    letter-spacing:.65em;color:rgba(160,235,255,.85);opacity:0;transition:opacity 1.2s ease 1s}
  .ilogo .sub::before,.ilogo .sub::after{content:"";height:1px;width:min(14vw,110px);background:linear-gradient(90deg,transparent,#5ef2ff);
    transform:scaleX(0);transform-origin:right;transition:transform 1.4s cubic-bezier(.16,1,.3,1) 1.1s}
  .ilogo .sub::after{background:linear-gradient(270deg,transparent,#5ef2ff);transform-origin:left}
  #intro.logo .nm{opacity:1;filter:blur(0) drop-shadow(0 0 22px rgba(94,242,255,.35));letter-spacing:.3em;margin-right:-.3em;animation:sheen 2.8s cubic-bezier(.5,0,.25,1) .5s forwards}
  #intro.logo .sub{opacity:1}
  #intro.logo .sub::before,#intro.logo .sub::after{transform:scaleX(1)}
  @keyframes sheen{from{background-position:100% 0}to{background-position:0 0}}
  @media(max-width:600px){.ibar{font-size:.52rem;letter-spacing:.12em}#iSkip{margin-left:10px}}
</style>
</head>
<body class="booting">
<div id="intro" role="button" tabindex="0" aria-label="Başlatmak için dokun">
  <canvas id="ir3d"></canvas>
  <div class="vig"></div><div class="grain"></div>
  <div class="ilogo"><div class="nm">BİLAL</div><div class="sub">MARK ∞ · ÇEVRİMİÇİ</div></div>
  <div class="tap"><i></i>BAŞLAT</div>
  <div class="ibar t"><span>J.A.R.V.I.S.</span><span id="iClock">--:--:--</span></div>
  <div class="ibar b"><span id="iMsg">&nbsp;</span><span>GÜÇ <b id="iPct">000</b>%<button id="iSkip" type="button">ATLA ›</button></span></div>
  <div class="iflash" id="iFlash"></div>
</div>
<div class="bg" id="bg"></div>
<div class="overlay"></div>
<div class="content">
  <h1>Sinem, bu kalp yalnız seninle ritim buluyor 💓</h1>
  <p>Bir seçim yapmadan önce iyi düşün... Çünkü bu hikaye yalnızca "Evet" diyene açılacak 💫</p>
  <div class="btns" id="box">
    <button class="yes" id="yes">Evet, Aşkı Başlat 💖</button>
    <button class="no" id="no">Hayır 😼</button>
  </div>
</div>
<div class="loveMsg" id="loveMsg">
  <h2>bn seni daha çok seviyorum 💋</h2>
  <p>Kalpler, öpücükler ve kedicikler senin için yağıyor!</p>
</div>
<canvas id="canvas"></canvas>
<audio id="music" src="https://dl.dropboxusercontent.com/scl/fi/k7grk2yq3y28c8n2l9bp9/Sezen-Aksu-Kaç-n-Kuras-.mp3?rlkey=6b2z5k1xzox8y9f2m9z0d6nuh&dl=0"></audio>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script>
// 3D yüklenemezse açılış kendini kaldırır, sayfa yine açılır
window.__introKill=function(){var i=document.getElementById('intro');if(i)i.remove();document.body.classList.remove('booting');};
setTimeout(function(){if(!window.__introReady)window.__introKill();},10000);
</script>
<script type="module">
// ===== AÇILIŞ: Three.js ile gerçek zamanlı 3D ark reaktörü =====
const intro=document.getElementById('intro'),$=id=>document.getElementById(id);
let THREE,EffectComposer,RenderPass,UnrealBloomPass,OutputPass,RoomEnvironment;
try{
  THREE=await import('three');
  ({EffectComposer}=await import('three/addons/postprocessing/EffectComposer.js'));
  ({RenderPass}=await import('three/addons/postprocessing/RenderPass.js'));
  ({UnrealBloomPass}=await import('three/addons/postprocessing/UnrealBloomPass.js'));
  ({OutputPass}=await import('three/addons/postprocessing/OutputPass.js'));
  ({RoomEnvironment}=await import('three/addons/environments/RoomEnvironment.js'));
}catch(e){window.__introKill();throw e;}

// --- Sahne ---
const cv=$('ir3d');let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});}catch(e){window.__introKill();throw e;}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x020407);
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(renderer),.04).texture;
const camera=new THREE.PerspectiveCamera(35,1,.05,200);

const steel=new THREE.MeshStandardMaterial({color:0xaab3bd,metalness:1,roughness:.26,envMapIntensity:.32});
const gunmetal=new THREE.MeshStandardMaterial({color:0x2b3138,metalness:1,roughness:.42,envMapIntensity:.22});
const copper=new THREE.MeshStandardMaterial({color:0xd27a3e,metalness:1,roughness:.3,envMapIntensity:.3});
const glow=new THREE.MeshStandardMaterial({color:0x000000,emissive:0x45e8ff,emissiveIntensity:0,toneMapped:false});
const coreM=new THREE.MeshStandardMaterial({color:0x000000,emissive:0xd8fdff,emissiveIntensity:0,toneMapped:false});

const R=new THREE.Group();scene.add(R);
const add=(geo,mat,f)=>{const m=new THREE.Mesh(geo,mat);f&&f(m);R.add(m);return m;};
const ring=(r,t,mat,z=0,seg=160)=>add(new THREE.TorusGeometry(r,t,24,seg),mat,m=>m.position.z=z);
// gövde
add(new THREE.CylinderGeometry(3.45,3.45,.5,128),gunmetal,m=>{m.rotation.x=Math.PI/2;m.position.z=-.45;});
ring(3.32,.17,steel,0);ring(3.02,.06,steel,.12);ring(2.98,.05,gunmetal,-.05);
for(let i=0;i<16;i++){const a=i/16*Math.PI*2;add(new THREE.CylinderGeometry(.07,.07,.12,16),steel,m=>{m.rotation.x=Math.PI/2;m.position.set(Math.cos(a)*3.17,Math.sin(a)*3.17,.16);});}
// bobin halkasının altındaki ışık (sadece aralardan sızar)
add(new THREE.RingGeometry(1.75,2.75,128),glow,m=>m.position.z=-.19);
// 10 bakır bobin
for(let i=0;i<10;i++){const g=new THREE.Group();g.rotation.z=i/10*Math.PI*2;R.add(g);
  const core=new THREE.Mesh(new THREE.BoxGeometry(.42,.95,.36),gunmetal);core.position.y=2.25;g.add(core);
  for(let k=0;k<9;k++){const w=new THREE.Mesh(new THREE.TorusGeometry(.29,.042,10,28),copper);w.rotation.x=Math.PI/2;w.scale.set(1,1,.78);w.position.y=1.86+k*.098;g.add(w);}
  const cap=new THREE.Mesh(new THREE.BoxGeometry(.66,.07,.46),steel);cap.position.y=2.78;g.add(cap);
  const cap2=cap.clone();cap2.position.y=1.72;g.add(cap2);}
// iç halka + ışık halkası
ring(1.56,.12,steel,.05);ring(1.36,.035,glow,.08);ring(1.22,.07,gunmetal,0);
for(let i=0;i<3;i++){const a=i/3*Math.PI*2+Math.PI/2;add(new THREE.BoxGeometry(.12,.5,.12),steel,m=>{m.rotation.z=a-Math.PI/2;m.position.set(Math.cos(a)*1.38,Math.sin(a)*1.38,.02);});}
// üçgen (Mark VI)
add(new THREE.TorusGeometry(1.08,.085,12,3),steel,m=>{m.rotation.z=-Math.PI/2;m.position.z=.12;});
const tri=add(new THREE.TorusGeometry(.92,.06,12,3),glow,m=>{m.rotation.z=-Math.PI/2;m.position.z=.18;});
// çekirdek
const core=add(new THREE.SphereGeometry(.5,48,24),coreM,m=>{m.scale.z=.35;m.position.z=.1;});
const light=new THREE.PointLight(0x7ff6ff,0,0,2);light.position.z=.9;R.add(light);
const rim=new THREE.DirectionalLight(0x9fc4ff,.5);rim.position.set(-6,7,6);scene.add(rim);

// kıvılcımlar
const N=700,pPos=new Float32Array(N*3),pVel=new Float32Array(N*3);let pLife=0;
const pGeo=new THREE.BufferGeometry();pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
const pMat=new THREE.PointsMaterial({color:0x9ff7ff,size:.05,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false});
R.add(new THREE.Points(pGeo,pMat));
function sparks(){for(let i=0;i<N;i++){pPos[i*3]=pPos[i*3+1]=0;pPos[i*3+2]=.3;const a=Math.random()*Math.PI*2,z=Math.random()*2-1,s=.06+Math.random()*.22,r=Math.sqrt(1-z*z);
  pVel[i*3]=Math.cos(a)*r*s;pVel[i*3+1]=Math.sin(a)*r*s;pVel[i*3+2]=Math.abs(z)*s*.6;}pLife=1;}

const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(1,1),.3,.4,.9);composer.addPass(bloom);composer.addPass(new OutputPass());
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);composer.setSize(w,h);bloom.resolution.set(w/2,h/2);camera.aspect=w/h;camera.updateProjectionMatrix();}
resize();addEventListener('resize',resize);

// --- Durum ve tween ---
const S={power:0,camT:0,dolly:0,logo:0,mode:'boot'};
const tweens=[],eio=e=>e<.5?4*e*e*e:1-Math.pow(-2*e+2,3)/2,ein=e=>e*e*e;
const tween=(k,to,dur,ease=eio)=>new Promise(res=>tweens.push({k,from:S[k],to,dur,t0:performance.now(),ease,res}));
const lerp=(a,b,t)=>a+(b-a)*t,A=new THREE.Vector3(8.2,3.8,10.5),F=new THREE.Vector3(0,0,15),tmp=new THREE.Vector3();
let flick=1,running=true,triA=0,lastT=0;
const clk=new THREE.Clock();
function frame(){if(!running)return;requestAnimationFrame(frame);const t=clk.getElapsedTime(),now=performance.now();
  for(let i=tweens.length-1;i>=0;i--){const w=tweens[i],p=Math.min((now-w.t0)/w.dur,1);S[w.k]=lerp(w.from,w.to,w.ease(p));if(p>=1){tweens.splice(i,1);w.res();}}
  const P=S.power*flick*(1+Math.sin(t*31)*.015);
  glow.emissiveIntensity=P*1.05;coreM.emissiveIntensity=.15+P*3.4;light.intensity=P*9;bloom.strength=.15+Math.min(P,2.4)*.3;
  const dt=t-lastT;lastT=t;if(S.mode==='logo')triA*=.9;else if(S.power>1.05)triA+=dt*(S.power-1)*7;
  tri.rotation.z=-Math.PI/2+triA;
  if(S.mode==='logo'){
    const w=innerWidth,h=innerHeight,D=Math.min(h*.26,w*.46),d=7.3*h/(.6306*D),vis=.6306*d;
    R.position.y=vis*.16;camera.fov=35;camera.position.set(Math.sin(t*.35)*.6,Math.cos(t*.3)*.3,d*(1-S.logo*.06));camera.lookAt(0,0,0);
    R.rotation.y=Math.sin(t*.4)*.12;R.rotation.x=Math.cos(t*.33)*.06;
  }else{
    tmp.lerpVectors(A,F,S.camT);const o=(1-S.camT)*.5;tmp.x+=Math.sin(t*.25)*o;tmp.y+=Math.cos(t*.2)*o;
    tmp.z=lerp(tmp.z,.75,S.dolly);tmp.x*=1-S.dolly;tmp.y*=1-S.dolly;
    camera.position.copy(tmp);camera.fov=lerp(35,78,S.dolly*S.dolly);camera.lookAt(0,0,0);
    if(S.dolly>0)camera.rotation.z=S.dolly*S.dolly*.6;
  }
  camera.updateProjectionMatrix();
  if(pLife>0){pLife-=.006;for(let i=0;i<N*3;i++){pPos[i]+=pVel[i];pVel[i]*=.985;}pGeo.attributes.position.needsUpdate=true;pMat.opacity=Math.max(pLife,0);}
  composer.render();}
frame();window.__introReady=true;

// --- Ses (Web Audio sentezi) ---
let AC,master;
function initAudio(){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.85;master.connect(AC.destination);}catch(e){}}
function tone(f,d,v,type='sine',f2){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a).connect(master);o.start(t);o.stop(t+d+.05);}
function noise(d,v,f0,f1,type='lowpass'){if(!AC)return;const t=AC.currentTime,len=AC.sampleRate*d|0,b=AC.createBuffer(1,len,AC.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
  const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),a=AC.createGain();s.buffer=b;fl.type=type;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);
  a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(a).connect(master);s.start(t);}
const zap=()=>{noise(.08,.35,6000,1500,'bandpass');tone(60,.09,.18,'sawtooth');};
function hum(d){if(!AC)return()=>{};const t=AC.currentTime,a=AC.createGain(),fl=AC.createBiquadFilter(),o1=AC.createOscillator(),o2=AC.createOscillator();
  o1.type='sawtooth';o2.type='sine';o1.frequency.setValueAtTime(40,t);o1.frequency.exponentialRampToValueAtTime(110,t+d);o2.frequency.setValueAtTime(80,t);o2.frequency.exponentialRampToValueAtTime(660,t+d);
  fl.type='lowpass';fl.Q.value=5;fl.frequency.setValueAtTime(160,t);fl.frequency.exponentialRampToValueAtTime(1800,t+d);
  a.gain.setValueAtTime(.0001,t);a.gain.exponentialRampToValueAtTime(.1,t+1.4);
  o1.connect(fl);o2.connect(fl);fl.connect(a).connect(master);o1.start(t);o2.start(t);
  let s=false;return()=>{if(s)return;s=true;const n=AC.currentTime;a.gain.cancelScheduledValues(n);a.gain.setValueAtTime(Math.max(a.gain.value,.0002),n);a.gain.exponentialRampToValueAtTime(.0001,n+.4);o1.stop(n+.45);o2.stop(n+.45);};}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

// --- HUD metni ---
const pad=n=>String(n).padStart(2,'0');
const clock=setInterval(()=>{const d=new Date();$('iClock').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());},250);
let msgTok=0;async function msg(txt){const my=++msgTok,el=$('iMsg');for(let i=1;i<=txt.length;i++){if(my!==msgTok)return;el.textContent=txt.slice(0,i);await sleep(22);}}
const pctTick=setInterval(()=>{$('iPct').textContent=String(Math.round(Math.min(S.power,1)*100)).padStart(3,'0');},50);

// --- Sekans ---
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let started=false,done=false,stopHum=()=>{};
const step=async ms=>{await sleep(ms);if(done)throw 0;};
async function boot(){
  if(started)return;started=true;initAudio();
  intro.classList.add('live');noise(.3,.45,2500,150);tone(150,.2,.22,'square',55);buzz(30);
  try{
    msg('ARK REAKTÖRÜ // ATEŞLEME');await step(650);
    for(const[p,ms]of[[.55,55],[0,130],[.9,45],[0,280],[.3,70],[0,110],[1,40],[.15,90]]){S.power=p;if(p>0){zap();buzz(15);}await step(ms);}
    stopHum=hum(4.4);tween('power',1,3600);tween('camT',1,4400);
    await step(300);msg('J.A.R.V.I.S. ÇEVRİMİÇİ');
    await step(1300);msg('REPULSÖRLER KALİBRE EDİLDİ');
    await step(1300);msg('ZIRH BÜTÜNLÜĞÜ %100');
    await step(1500);msg('ÇIKIŞ 3 GW // AŞIRI YÜK');
    stopHum();tone(140,1.5,.12,'sawtooth',2400);tone(280,1.5,.06,'sine',4800);buzz(1400);
    tween('power',2.4,1500,ein);await tween('dolly',1,1550,ein);if(done)return;
    // beyaz patlama
    noise(2.2,.6,3000,40);tone(65,1.6,.9,'sine',26);buzz([90,40,140]);
    const fl=$('iFlash').animate([{opacity:1},{opacity:1,offset:.2},{opacity:0}],{duration:1900,easing:'ease-out',fill:'forwards'});
    S.mode='logo';S.dolly=0;S.power=1.15;camera.rotation.z=0;sparks();tween('logo',1,6000,t=>t);
    intro.classList.add('logo');msg('HOŞ GELDİNİZ, EFENDİM.');
    await step(4200);exit();
  }catch(e){}
}
function exit(){
  if(intro.classList.contains('exit'))return;done=true;stopHum();
  noise(1.3,.25,300,6000);intro.classList.add('exit');document.body.classList.remove('booting');
  setTimeout(()=>{running=false;clearInterval(clock);clearInterval(pctTick);renderer.dispose();composer.dispose&&composer.dispose();intro.remove();},1300);
}
intro.addEventListener('click',boot);
intro.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();boot();}});
$('iSkip').addEventListener('click',e=>{e.stopPropagation();exit();});
</script>
<script>
const yes=document.getElementById('yes');
const no=document.getElementById('no');
const msg=document.getElementById('loveMsg');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const bg=document.getElementById('bg');
const music=document.getElementById('music');
const box=document.getElementById('box');
let W=canvas.width=innerWidth,H=canvas.height=innerHeight;
let hearts=[];

function createHeart(){
  const icons=['💖','💋','🐱'];
  const icon=icons[Math.floor(Math.random()*icons.length)];
  return{x:Math.random()*W,y:-20,s:Math.random()*24+20,vy:Math.random()*5+2,a:1,t:icon};
}

function draw(){
  ctx.clearRect(0,0,W,H);
  hearts.forEach(h=>{
    h.y+=h.vy;h.a-=0.003;
    ctx.globalAlpha=h.a;
    ctx.font=h.s+'px serif';
    ctx.fillText(h.t,h.x,h.y);
  });
  hearts=hearts.filter(h=>h.y<H && h.a>0);
  requestAnimationFrame(draw);
}

draw();

function burst(n=200){
  for(let i=0;i<n;i++)hearts.push(createHeart());
}

let musicStarted=false;
yes.addEventListener('click',()=>{
  if(!musicStarted){
    music.play();
    musicStarted=true;
    setTimeout(()=>{music.pause();},20000);
  }
  msg.style.display='flex';
  burst(400);
  bg.style.transform='scale(1.1)';
  if(navigator.vibrate)navigator.vibrate([40,20,40]);
  setTimeout(()=>{msg.style.display='none';bg.style.transform='scale(1)';},20000);
});

// Hayır görünmez büyük kare içinde çok hızlı kaçıyor
function moveNo(e){
  const boxRect=box.getBoundingClientRect();
  const rect=no.getBoundingClientRect();
  const dx=e.clientX - (rect.left + rect.width/2);
  const dy=e.clientY - (rect.top + rect.height/2);
  const dist=Math.sqrt(dx*dx + dy*dy);
  if(dist<150){
    const angle=Math.atan2(dy,dx);
    const offset=180; // Daha hızlı kaçış
    let newX=rect.left - Math.cos(angle)*offset - boxRect.left;
    let newY=rect.top - Math.sin(angle)*offset - boxRect.top;
    newX=Math.min(Math.max(newX,0),boxRect.width-rect.width);
    newY=Math.min(Math.max(newY,0),boxRect.height-rect.height);
    no.style.left=newX+'px';
    no.style.top=newY+'px';
  }
}

box.addEventListener('mousemove',moveNo);
window.addEventListener('resize',()=>{W=canvas.width=innerWidth;H=canvas.height=innerHeight;});
setInterval(()=>{if(musicStarted)hearts.push(createHeart());},60);
</script>
